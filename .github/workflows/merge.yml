name: Merge Drive Videos

on:
  workflow_dispatch:  # تشغيل يدوي

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Upgrade pip & install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install moviepy==2.2.1 google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      # 4️⃣ Install FFmpeg
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 5️⃣ Run merge script
      - name: Run merge script
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: python Youtube.py

      # 6️⃣ Upload result as artifact
      - name: Upload merged video artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-video
          path: final_merged.mp4
