name: Merge Drive Videos

on:
  workflow_dispatch:   # تشغيل يدوي

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies in clean environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip uninstall -y moviepy
          python -m pip install moviepy==2.0.0 google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify MoviePy and FFmpeg
        run: |
          python -m pip show moviepy
          python -c "from moviepy.editor import VideoFileClip; print('MoviePy editor works!')"
          ffmpeg -version

      - name: Run merge script
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: python Youtube.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: merged-video
          path: final_merged.mp4
