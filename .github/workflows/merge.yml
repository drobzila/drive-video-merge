name: Merge Drive Videos

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install moviepy==2.2.1 imageio-ffmpeg google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Check Python and MoviePy
        run: |
          which python3
          python3 --version
          python3 -m pip show moviepy

      - name: Run Youtube.py
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: python3 Youtube.py

      - name: Upload merged video artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-video
          path: final_merged.mp4
